<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1565c0">
<link rel="manifest" href="manifest.json">
<title>Medical Billing Pro</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#17212b}
header{background:#1565c0;color:#fff;padding:16px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:20px}header small{opacity:.85}
nav{display:flex;gap:6px;overflow:auto;padding:10px;background:#fff;border-bottom:1px solid #ddd}
nav button{border:0;background:#eef3f8;padding:10px 13px;border-radius:8px;white-space:nowrap}
nav button.active{background:#1565c0;color:#fff}
main{max-width:1100px;margin:auto;padding:16px}.page{display:none}.page.active{display:block}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 5px #0001}.card b{font-size:24px;display:block;margin-top:8px}
.panel{background:#fff;border-radius:12px;padding:16px;margin-top:14px;box-shadow:0 1px 5px #0001}
input,select{width:100%;padding:10px;border:1px solid #ccd5df;border-radius:7px;margin:5px 0 10px}
button.primary{background:#1565c0;color:#fff;border:0;padding:10px 14px;border-radius:7px}
table{width:100%;border-collapse:collapse;margin-top:10px}th,td{padding:9px;border-bottom:1px solid #e4e8ed;text-align:left;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.muted{color:#65717d}
.invoice{border:1px solid #ddd;padding:18px;margin-top:12px;background:white}
.right{text-align:right}
@media(max-width:600px){main{padding:10px}.panel{padding:12px}th,td{font-size:12px}}
@media print{body>*:not(main){display:none!important}main{padding:0}.page:not(#billing){display:none!important}#billing>h2,#billing>.panel{display:none!important}.invoice{border:0;box-shadow:none}}
</head>
<body>
<header><h1>Raj Pushpa Boitech</h1><small>Medical Business Billing & Inventory</small></header>
<nav id="nav">
<button data-page="dashboard" class="active">Dashboard</button>
<button data-page="billing">New Bill</button>
<button data-page="medicines">Medicines</button>
<button data-page="purchase">Purchase</button>
<button data-page="customers">Customers</button>
<button data-page="reports">Reports</button>
</nav>
<main>
<section id="dashboard" class="page active">
<h2 id="dashboardTitle">Dashboard</h2><p class="muted" id="businessSubtitle"></p>
<div class="cards">
<div class="card">Today's Sales<b id="dashSales">₹0</b></div>
<div class="card">Invoices<b id="dashBills">0</b></div>
<div class="card">Stock Items<b id="dashStock">0</b></div>
<div class="card">Low Stock<b id="dashLow">0</b></div>
</div>
<div class="panel"><h3>Quick actions</h3><button class="primary" onclick="showPage('billing')">+ New Medical Bill</button>
<button class="primary" onclick="showPage('medicines')">+ Add Medicine</button></div>
</section>

<section id="billing" class="page">
<h2>New Sale / GST Bill</h2>
<div class="panel">
<div class="grid"><label>Customer/Patient<input id="custName" placeholder="Name"></label>
<label>Invoice No.<input id="invoiceNo" readonly></label></div>
<table><thead><tr><th>Medicine</th><th>Batch</th><th>Qty</th><th>Rate</th><th>GST %</th><th>Total</th><th></th></tr></thead>
<tbody id="billRows"></tbody></table>
<button class="primary" onclick="addBillRow()">+ Add Item</button>
<div class="right"><h3>Grand Total: ₹<span id="grandTotal">0.00</span></h3>
<button class="primary" onclick="saveBill()">Save Bill & Print</button></div>
</div>
<div id="printArea"></div>
</section>

<section id="medicines" class="page">
<h2>Medicine Master & Stock</h2>
<div class="panel">
<div class="grid">
<label>Medicine Name<input id="mName" placeholder="e.g. Paracetamol 500mg"></label>
<label>Batch No.<input id="mBatch" placeholder="Batch"></label>
<label>Expiry<input id="mExpiry" type="month"></label>
<label>MRP<input id="mMrp" type="number"></label>
<label>Sale Rate<input id="mRate" type="number"></label>
<label>GST %<input id="mGst" type="number" value="5"></label>
<label>HSN<input id="mHsn"></label><label>Barcode<input id="mBarcode" placeholder="Scan/type barcode"></label>
<label>Stock Qty<input id="mQty" type="number"></label>
</div><button class="primary" onclick="addMedicine()">Save Medicine</button>
</div>
<div class="panel"><table><thead><tr><th>Medicine</th><th>Batch</th><th>Expiry</th><th>Rate</th><th>Stock</th><th>GST</th></tr></thead><tbody id="medicineTable"></tbody></table></div>
</section>

<section id="purchase" class="page">
<h2>Purchase Entry</h2>
<div class="panel"><p class="muted">Phase 1 starter: purchase module is prepared for batch-wise stock integration.</p>
<div class="grid"><label>Supplier<input id="supplier" placeholder="Supplier name"></label><label>Purchase Invoice<input id="purchaseNo"></label><label>Date<input id="purchaseDate" type="date"></label></div>
<button class="primary" onclick="alert('Purchase form saved as a draft in this prototype.')">Save Purchase</button></div>
</section>

<section id="customers" class="page">
<h2>Customers / Patients</h2>
<div class="panel"><div class="grid"><label>Name<input id="newCustomer"></label><label>Mobile<input id="newMobile"></label></div>
<button class="primary" onclick="addCustomer()">Add Customer</button></div>
<div class="panel"><table><thead><tr><th>Name</th><th>Mobile</th></tr></thead><tbody id="customerTable"></tbody></table></div>
</section>

<section id="reports" class="page">
<h2>Reports</h2>
<div class="panel"><h3>Sales Summary</h3><p>Total invoices: <b id="reportBills">0</b></p><p>Total sales: <b>₹<span id="reportSales">0.00</span></b></p></div>
<div class="panel"><h3>Important next modules</h3><ul><li>GST summary</li><li>Expiry alerts</li><li>Low-stock alerts</li><li>Profit report</li><li>Excel/CSV export</li><li>Cloud backup</li></ul></div>
</section>
</main>
<script>
const KEY='medicalBillingProV4';
let db=JSON.parse(localStorage.getItem(KEY)||'{"medicines":[],"bills":[],"customers":[],"returns":[],"settings":{"name":"Raj Pushpa Boitech","gstin":"10EGWPP8054D1Z5","mobile":"9470284686","email":"Rajpushpabiotech@gmail.com","address":"Sasaram, Rohtas, Bihar","prefix":"INV"}}');
db.settings ||= {name:"Raj Pushpa Boitech",gstin:"10EGWPP8054D1Z5",mobile:"9470284686",email:"Rajpushpabiotech@gmail.com",address:"Sasaram, Rohtas, Bihar",prefix:"INV",mode:"Both - Retail + Distributor",printMode:"Both A4 + 80mm"};
function persist(){localStorage.setItem(KEY,JSON.stringify(db));refresh()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showPage(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===id));if(id==='billing'&&document.querySelectorAll('#billRows tr').length===0)addBillRow();if(id==='history')renderHistory()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>showPage(b.dataset.page));

function refresh(){
 const sales=db.bills.reduce((s,b)=>s+b.total,0),stock=db.medicines.reduce((s,m)=>s+(+m.qty||0),0);
 dashSales.textContent='₹'+sales.toFixed(2);dashBills.textContent=db.bills.length;dashStock.textContent=stock;dashLow.textContent=db.medicines.filter(m=>(+m.qty||0)<10).length;
 reportBills.textContent=db.bills.length;reportSales.textContent=sales.toFixed(2);businessSubtitle.textContent=[db.settings.name,db.settings.gstin].filter(Boolean).join(' • ');
 medicineTable.innerHTML=db.medicines.map(m=>`<tr><td>${esc(m.name)}</td><td>${esc(m.batch)}</td><td>${esc(m.expiry||'-')}</td><td>₹${(+m.rate).toFixed(2)}</td><td>${m.qty}</td><td>${m.gst}%</td></tr>`).join('');
 customerTable.innerHTML=db.customers.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.mobile||'')}</td></tr>`).join('');
 let old=document.getElementById('alerts');if(old)old.remove();
 const exp=db.medicines.filter(m=>m.expiry&&new Date(m.expiry+'-01')<=new Date(Date.now()+90*86400000)),low=db.medicines.filter(m=>(+m.qty||0)<10);
 if(exp.length||low.length){const div=document.createElement('div');div.id='alerts';div.className='panel';div.innerHTML='<h3>Alerts</h3>'+
 (exp.length?`<div class="alert">⚠️ ${exp.length} medicine(s) expire within 90 days.</div>`:'')+
 (low.length?`<div class="alert">⚠️ ${low.length} medicine(s) have low stock.</div>`:'');dashboard.appendChild(div)}
}
function saveSettings(){db.settings={name:bizName.value.trim()||'Medical Billing Pro',gstin:bizGstin.value.trim(),mobile:bizMobile.value.trim(),email:bizEmail.value.trim(),address:bizAddress.value.trim(),prefix:bizPrefix.value.trim()||'INV',mode:bizMode.value,printMode:printMode.value};persist();alert('Business settings saved.')}
function addMedicine(){
 const m={id:crypto.randomUUID(),name:mName.value.trim(),batch:mBatch.value.trim(),expiry:mExpiry.value,mrp:+mMrp.value||0,rate:+mRate.value||0,gst:+mGst.value||0,hsn:mHsn.value.trim(),barcode:mBarcode.value.trim(),qty:+mQty.value||0};
 if(!m.name||!m.batch)return alert('Medicine name and batch are required');db.medicines.push(m);persist();
 ['mName','mBatch','mExpiry','mMrp','mRate','mHsn','mBarcode','mQty'].forEach(id=>document.getElementById(id).value='');mGst.value=5;
}
function addBillRow(){
 const tr=document.createElement('tr');
 tr.innerHTML=`<td><select class="bi">${db.medicines.map((m,i)=>`<option value="${i}">${esc(m.name)} — ${esc(m.batch)}</option>`).join('')}</select></td><td class="bb"></td><td><input class="bq" type="number" value="1" min="1"></td><td class="br"></td><td class="bg"></td><td class="bt">0.00</td><td><button onclick="this.closest('tr').remove();calcBill()">×</button></td>`;
 billRows.appendChild(tr);tr.querySelector('.bi').onchange=()=>updateRow(tr);tr.querySelector('.bq').oninput=calcBill;updateRow(tr);
}
function updateRow(tr){const m=db.medicines[+tr.querySelector('.bi').value];if(!m)return;tr.querySelector('.bb').textContent=m.batch;tr.querySelector('.br').textContent=(+m.rate).toFixed(2);tr.querySelector('.bg').textContent=m.gst;calcBill()}
function calcBill(){let total=0;document.querySelectorAll('#billRows tr').forEach(tr=>{const m=db.medicines[+tr.querySelector('.bi').value];if(!m)return;const q=+tr.querySelector('.bq').value||0;const x=q*m.rate*(1+m.gst/100);tr.querySelector('.bt').textContent=x.toFixed(2);total+=x});grandTotal.textContent=total.toFixed(2)}
function saveBill(){
 const rows=[...document.querySelectorAll('#billRows tr')];if(!rows.length)return alert('Add at least one medicine');
 const items=rows.map(tr=>{const m=db.medicines[+tr.querySelector('.bi').value],q=+tr.querySelector('.bq').value||0, taxable=q*m.rate,tax=taxable*m.gst/100;return {medicineId:m.id,name:m.name,batch:m.batch,hsn:m.hsn,qty:q,rate:m.rate,gst:m.gst,taxable,tax,total:taxable+tax}});
 for(const i of items){const m=db.medicines.find(x=>x.id===i.medicineId);if(!m||m.qty<i.qty)return alert(`Insufficient stock: ${i.name} (${i.batch})`)}
 items.forEach(i=>db.medicines.find(x=>x.id===i.medicineId).qty-=i.qty);
 const total=items.reduce((s,x)=>s+x.total,0),prefix=db.settings.prefix||'INV',no=prefix+'-'+String(db.bills.length+1).padStart(5,'0');
 db.bills.push({no,customer:custName.value.trim(),items,total,date:new Date().toISOString()});persist();invoiceNo.value=no;
 const tax=items.reduce((s,i)=>s+i.tax,0),half=tax/2;
 printArea.innerHTML=`<div class="invoice"><h2>${esc(db.settings.name)}</h2><p>${esc(db.settings.address)}<br>GSTIN: ${esc(db.settings.gstin)} | Mobile: ${esc(db.settings.mobile)} | Email: ${esc(db.settings.email)}</p><hr><h3>MEDICAL TAX INVOICE</h3><p><b>Invoice:</b> ${esc(no)}<br><b>Customer:</b> ${esc(custName.value||'Walk-in Customer')}<br><b>Date:</b> ${new Date().toLocaleDateString()}</p><table><tr><th>Medicine</th><th>HSN</th><th>Batch</th><th>Qty</th><th>Rate</th><th>GST</th><th>Total</th></tr>${items.map(i=>`<tr><td>${esc(i.name)}</td><td>${esc(i.hsn)}</td><td>${esc(i.batch)}</td><td>${i.qty}</td><td>₹${i.rate.toFixed(2)}</td><td>${i.gst}%</td><td>₹${i.total.toFixed(2)}</td></tr>`).join('')}</table><p class="right">Taxable: ₹${items.reduce((s,i)=>s+i.taxable,0).toFixed(2)}<br>CGST: ₹${half.toFixed(2)}<br>SGST: ₹${half.toFixed(2)}</p><h3 class="right">Grand Total: ₹${total.toFixed(2)}</h3></div>`;
 window.print();billRows.innerHTML='';custName.value='';addBillRow();
}
function addCustomer(){if(!newCustomer.value.trim())return;db.customers.push({name:newCustomer.value.trim(),mobile:newMobile.value.trim()});persist();newCustomer.value='';newMobile.value=''}
function processReturn(){const no=returnInvoice.value.trim(),name=returnMedicine.value.trim().toLowerCase(),q=+returnQty.value||0,bill=db.bills.find(b=>b.no===no);if(!bill)return alert('Invoice not found');const item=bill.items.find(i=>i.name.toLowerCase()===name);if(!item||q<=0||q>item.qty)return alert('Matching item/quantity not found');const m=db.medicines.find(x=>x.id===item.medicineId);if(m)m.qty+=q;item.qty-=q;item.total=item.qty*item.rate*(1+item.gst/100);db.returns.push({no,name,qty:q,date:new Date().toISOString()});persist();alert('Return processed and stock restored.')}
function renderHistory(){
 const q=(historySearch.value||'').toLowerCase(),from=historyFrom.value,to=historyTo.value;
 const rows=db.bills.filter(b=>(!q||b.no.toLowerCase().includes(q)||(b.customer||'').toLowerCase().includes(q))&&(!from||b.date.slice(0,10)>=from)&&(!to||b.date.slice(0,10)<=to));
 historyTable.innerHTML=rows.map(b=>`<tr><td>${esc(b.no)}</td><td>${new Date(b.date).toLocaleString()}</td><td>${esc(b.customer||'Walk-in')}</td><td>${b.items.reduce((s,i)=>s+i.qty,0)}</td><td>₹${b.total.toFixed(2)}</td></tr>`).join('')||'<tr><td colspan="5">No invoices found</td></tr>';
}
function exportSalesCSV(){
 const lines=[['Invoice','Date','Customer','Medicine','Batch','Qty','Rate','GST','Total']];
 db.bills.forEach(b=>b.items.forEach(i=>lines.push([b.no,b.date,b.customer||'Walk-in',i.name,i.batch,i.qty,i.rate,i.gst,i.total.toFixed(2)])));
 const csv=lines.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(',')).join('\n');
 const blob=new Blob([csv],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sales-report.csv';a.click();URL.revokeObjectURL(a.href);
}
function downloadBackup(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='medical-billing-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}
restoreFile.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.medicines||!x.bills)throw 0;db=x;persist();alert('Backup restored.')}catch{alert('Invalid backup file')}};r.readAsText(f)};
invoiceNo.value=(db.settings.prefix||'INV')+'-'+String(db.bills.length+1).padStart(5,'0');refresh();
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("service-worker.js").catch(()=>{})}</script></body>
</html>
